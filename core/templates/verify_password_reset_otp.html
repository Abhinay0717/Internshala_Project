<!DOCTYPE html>
<html>
<head>

    <title>Verify Password Reset OTP</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            width: 400px;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 10px;
        }

        p {
            text-align: center;
            color: #555;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-bottom: 20px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            background: #007bff;
            color: white;
            font-size: 16px;
            cursor: pointer;
            margin-bottom: 10px;
        }

        button:hover {
            background: #0056b3;
        }

        .resend-button {
            background: #28a745;
        }

        .resend-button:hover {
            background: #1e7e34;
        }

        .error {
            color: #721c24;
            background: #f8d7da;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            text-align: center;
        }

        .success {
            color: #155724;
            background: #d4edda;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            text-align: center;
        }

    </style>

</head>

<body>

<div class="container">

    <h2>Verify OTP</h2>

    <p>
        Enter the 6-digit OTP sent to your registered email.
    </p>

    {% if error %}

        <div class="error">
            {{ error }}
        </div>

    {% endif %}

    {% if message %}

        <div class="success">
            {{ message }}
        </div>

    {% endif %}


    <!-- VERIFY OTP -->

    <form method="POST">

        {% csrf_token %}

        <label for="otp">
            Enter OTP
        </label>

        <input
            type="text"
            id="otp"
            name="otp"
            maxlength="6"
            minlength="6"
            pattern="[0-9]{6}"
            placeholder="Enter 6-digit OTP"
            required
        >

        <button
            type="submit"
            name="action"
            value="verify"
        >
            Verify OTP
        </button>

    </form>


    <!-- RESEND OTP -->

    <form method="POST">

        {% csrf_token %}

        <button
            type="submit"
            name="action"
            value="resend"
            class="resend-button"
        >
            Resend OTP
        </button>

    </form>

</div>

</body>
</html>
