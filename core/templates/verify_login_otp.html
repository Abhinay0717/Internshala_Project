<!DOCTYPE html>
<html>
<head>

    <title>Login Verification</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .box {
            background: white;
            width: 400px;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }

        h2 {
            margin-bottom: 10px;
        }

        p {
            color: #555;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 15px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            text-align: center;
            letter-spacing: 3px;
        }

        button {
            width: 96%;
            padding: 12px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        .error {
            color: red;
            margin-bottom: 15px;
        }

        .info {
            color: #555;
            font-size: 14px;
            margin-top: 15px;
        }

    </style>

</head>

<body>

<div class="box">

    <h2>Login Verification</h2>

    <p>
        A verification OTP has been sent to your registered email.
    </p>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

    {% if message %}
        <p>
            {{ message }}
        </p>
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <input
            type="text"
            name="otp"
            placeholder="Enter 6-digit OTP"
            maxlength="6"
            pattern="[0-9]{6}"
            required
        >

        <button type="submit">
            Verify OTP
        </button>

    </form>

    <div class="info">
        OTP is valid for 5 minutes.
    </div>

</div>

</body>
</html>
