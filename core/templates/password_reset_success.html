<!DOCTYPE html>
<html>
<head>
    <title>Password Reset Successful</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            width: 400px;
            background: white;
            padding: 35px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .success-icon {
            font-size: 50px;
            margin-bottom: 15px;
        }

        h2 {
            color: green;
            margin-bottom: 15px;
        }

        p {
            color: #555;
            line-height: 1.6;
        }

        .note {
            margin-top: 20px;
            padding: 12px;
            background: #fff3cd;
            border-radius: 5px;
            color: #856404;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        a:hover {
            background: #0056b3;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="success-icon">
        ✓
    </div>

    <h2>Password Reset Successful</h2>

    <p>
        Your password has been reset successfully.
    </p>

    <p>
        Your new temporary password has been sent
        to your registered email address.
    </p>

    <div class="note">
        Please log in using the new password and
        change it after your first successful login.
    </div>

    <a href="/">
        Go to Login
    </a>

</div>

</body>
</html>
