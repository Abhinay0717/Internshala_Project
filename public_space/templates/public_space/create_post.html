<!DOCTYPE html>
<html>

<head>

    <title>Create Post</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .container {
            width: 90%;
            max-width: 700px;
            margin: 40px auto;
        }

        .box {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        button,
        .button {
            padding: 10px 15px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
        }

        .back {
            background: #6c757d;
        }

        .message {
            background: #fff3cd;
            padding: 10px;
            margin-bottom: 10px;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="box">

        <h1>
            Create Post
        </h1>

        <p>
            Accepted Friends:
            <strong>{{ friend_count }}</strong>
        </p>

        <p>

            Daily Post Limit:

            {% if daily_limit is None %}
                Unlimited
            {% else %}
                {{ daily_limit }}
            {% endif %}

        </p>


        {% for message in messages %}

            <div class="message">
                {{ message }}
            </div>

        {% endfor %}


        <form
            method="POST"
            enctype="multipart/form-data"
        >

            {% csrf_token %}

            {{ form.as_p }}

            <button
                type="submit"
            >
                Publish Post
            </button>

        </form>


        <br>

        <a
            href="{% url 'public_space' %}"
            class="button back"
        >
            ← Back to Public Space
        </a>

    </div>

</div>

</body>

</html>
